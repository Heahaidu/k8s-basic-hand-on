apiVersion: eksctl.io/v1alpha5
kind: ClusterConfig

metadata:
  name: test
  region: us-east-1
  version: "1.35"

vpc:
  cidr: "10.0.0.0/16"

availabilityZones: ["us-east-1a", "us-east-1b"]

managedNodeGroups:
  - name: general
    instanceType: t3.small
    desiredCapacity: 2
    minSize: 2
    maxSize: 4
    volumeSize: 20
    privateNetworking: true
    # eksctl tự tạo NAT Gateway + spread node theo AZ
  - name: game-2048
    instanceType: t3.small
    desiredCapacity: 2
    minSize: 2 
    maxSize: 4
    volumeSize: 20
    privateNetworking: true
    labels:
      workload: game-2048
    taints: 
      - key: workload
        value: game-2048
        effect: NoSchedule
iam:
  withOIDC: true